# docker json-file 日志轮转：给每个服务的 docker logs 落盘封顶，避免长期运行涨爆磁盘。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  caddy:
    logging: *default-logging
    image: ${VANBLOG_DOCKER_REPO:-kevinchina/deeplearning}:vanblog-caddy-${VANBLOG_RELEASE_SUFFIX:-latest}
    restart: always
    depends_on:
      server:
        condition: service_healthy
      website:
        condition: service_healthy
      admin:
        condition: service_healthy
      waline:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      EMAIL: ${EMAIL:-someone@example.com}
    volumes:
      - ${VANBLOG_LOG_DIR:-./log}:/var/log
      - ${VANBLOG_CADDY_CONFIG_DIR:-./caddy/config}:/root/.config/caddy
      - ${VANBLOG_CADDY_DATA_DIR:-./caddy/data}:/root/.local/share/caddy
    ports:
      - ${VANBLOG_HTTP_PORT:-80}:80

  server:
    logging: *default-logging
    image: ${VANBLOG_DOCKER_REPO:-kevinchina/deeplearning}:vanblog-server-${VANBLOG_RELEASE_SUFFIX:-latest}
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      VAN_BLOG_DATABASE_URL: ${VAN_BLOG_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vanblog}}
      VAN_BLOG_REDIS_URL: ${VAN_BLOG_REDIS_URL:-redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379}
      VAN_BLOG_WALINE_DB: ${VAN_BLOG_WALINE_DB:-waline}
      VAN_BLOG_WALINE_DATABASE_URL: ${VAN_BLOG_WALINE_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${VAN_BLOG_WALINE_DB:-waline}}
      VAN_BLOG_CADDY_MANAGE_HTTPS: ${VAN_BLOG_CADDY_MANAGE_HTTPS:-false}
      VAN_BLOG_CLOUDFLARE_API_TOKEN: ${VAN_BLOG_CLOUDFLARE_API_TOKEN:-}
      VAN_BLOG_CLOUDFLARE_ZONE_ID: ${VAN_BLOG_CLOUDFLARE_ZONE_ID:-}
      VAN_BLOG_PIPELINE_EXECUTION_ENABLED: ${VAN_BLOG_PIPELINE_EXECUTION_ENABLED:-false}
      VANBLOG_ISR_TOKEN: ${VANBLOG_ISR_TOKEN:-}
      VANBLOG_CADDY_API_URL: http://caddy:2019
      VANBLOG_WEBSITE_CONTROL_URL: http://website:3011
      VANBLOG_WALINE_CONTROL_URL: http://waline:8361
      VANBLOG_KROKI_URL: http://kroki:8000
      VANBLOG_WEBSITE_ISR_BASE: http://website:3001/api/revalidate?path=
      WALINE_JWT_TOKEN: ${WALINE_JWT_TOKEN:-}
      VANBLOG_BACKUP_ENCRYPTION_KEY: ${VANBLOG_BACKUP_ENCRYPTION_KEY:-}
    volumes:
      - ${VANBLOG_STATIC_DIR:-./data/static}:/app/static
      - ${VANBLOG_LOG_DIR:-./log}:/var/log
      - ${VANBLOG_SECRET_DIR:-./secrets}:/run/secrets/vanblog
      - ${VANBLOG_ALIYUNPAN_CONFIG_DIR:-./aliyunpan/config}:/home/vanblog/.config/aliyunpan
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  website:
    logging: *default-logging
    image: ${VANBLOG_DOCKER_REPO:-kevinchina/deeplearning}:vanblog-website-${VANBLOG_RELEASE_SUFFIX:-latest}
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: 256
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      PORT: 3001
      WEBSITE_CONTROL_PORT: 3011
      VAN_BLOG_SERVER_URL: http://server:3000
      VAN_BLOG_REVALIDATE: 'false'
      VAN_BLOG_ALLOW_DOMAINS: ${VAN_BLOG_ALLOW_DOMAINS:-pic.mereith.com}
      VANBLOG_ISR_TOKEN: ${VANBLOG_ISR_TOKEN:-}
      WALINE_JWT_TOKEN: ${WALINE_JWT_TOKEN:-}
    expose:
      - '3001'
      - '3011'
    volumes:
      - ${VANBLOG_LOG_DIR:-./log}:/var/log
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3011/health >/dev/null || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  admin:
    logging: *default-logging
    image: ${VANBLOG_DOCKER_REPO:-kevinchina/deeplearning}:vanblog-admin-${VANBLOG_RELEASE_SUFFIX:-latest}
    restart: always
    expose:
      - '3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3002/admin/ || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  waline:
    logging: *default-logging
    image: ${VANBLOG_DOCKER_REPO:-kevinchina/deeplearning}:vanblog-waline-${VANBLOG_RELEASE_SUFFIX:-latest}
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      PORT: 8360
      WALINE_CONTROL_PORT: 8361
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: ${VAN_BLOG_WALINE_DB:-waline}
      PG_USER: ${POSTGRES_USER:-postgres}
      PG_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_TOKEN: ${WALINE_JWT_TOKEN:-}
    expose:
      - '8360'
      - '8361'
    volumes:
      - ${VANBLOG_LOG_DIR:-./log}:/var/log
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8361/health >/dev/null || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    restart: always
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-vanblog}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${VANBLOG_POSTGRES_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vanblog}']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - ${VANBLOG_REDIS_DIR:-./data/redis}:/data
    command:
      [
        'sh',
        '-c',
        'exec redis-server --appendonly yes --loglevel warning --requirepass "$$REDIS_PASSWORD"',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s

  kroki:
    logging: *default-logging
    image: yuzutech/kroki
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
