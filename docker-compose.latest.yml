# docker json-file 日志轮转：给每个服务的 docker logs 落盘封顶，避免长期运行涨爆磁盘。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  caddy:
    logging: *default-logging
    image: kevinchina/deeplearning:vanblog-caddy-latest
    restart: always
    depends_on:
      server:
        condition: service_healthy
      website:
        condition: service_healthy
      admin:
        condition: service_healthy
      waline:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      EMAIL: your-email@example.com
      NO_PROXY: localhost,127.0.0.1,server,website,admin,waline,postgres,redis,kroki
      no_proxy: localhost,127.0.0.1,server,website,admin,waline,postgres,redis,kroki
    volumes:
      - ./log:/var/log
      - ./caddy/config:/root/.config/caddy
      - ./caddy/data:/root/.local/share/caddy
    ports:
      - "80:80"

  server:
    logging: *default-logging
    image: kevinchina/deeplearning:vanblog-server-latest
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      NO_PROXY: localhost,127.0.0.1,server,website,admin,waline,postgres,redis,kroki
      no_proxy: localhost,127.0.0.1,server,website,admin,waline,postgres,redis,kroki
      VAN_BLOG_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/vanblog
      VAN_BLOG_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      VAN_BLOG_WALINE_DB: waline
      VAN_BLOG_WALINE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/waline
      VAN_BLOG_CADDY_MANAGE_HTTPS: "false"
      VAN_BLOG_PIPELINE_EXECUTION_ENABLED: "false"
      VANBLOG_CADDY_API_URL: http://caddy:2019
      VANBLOG_WEBSITE_CONTROL_URL: http://website:3011
      VANBLOG_WALINE_CONTROL_URL: http://waline:8361
      VANBLOG_KROKI_URL: http://kroki:8000
      VANBLOG_WEBSITE_ISR_BASE: http://website:3001/api/revalidate?path=
      WALINE_JWT_TOKEN: ""
      VANBLOG_BACKUP_ENCRYPTION_KEY: ""
    volumes:
      - ./data/static:/app/static
      - ./log:/var/log
      - ./secrets:/run/secrets/vanblog
      - ./aliyunpan/config:/home/vanblog/.config/aliyunpan
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  website:
    logging: *default-logging
    image: kevinchina/deeplearning:vanblog-website-latest
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: 256
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      NO_PROXY: localhost,127.0.0.1,server,website,admin,waline,postgres,redis,kroki
      no_proxy: localhost,127.0.0.1,server,website,admin,waline,postgres,redis,kroki
      PORT: 3001
      WEBSITE_CONTROL_PORT: 3011
      VAN_BLOG_SERVER_URL: http://server:3000
      VAN_BLOG_REVALIDATE: "false"
      VAN_BLOG_ALLOW_DOMAINS: pic.mereith.com
      WALINE_JWT_TOKEN: ""
    expose:
      - "3001"
      - "3011"
    volumes:
      - ./log:/var/log
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q -O - http://127.0.0.1:3011/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  admin:
    logging: *default-logging
    image: kevinchina/deeplearning:vanblog-admin-latest
    restart: always
    expose:
      - "3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q -O /dev/null http://127.0.0.1:3002/admin/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  waline:
    logging: *default-logging
    image: kevinchina/deeplearning:vanblog-waline-latest
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      NO_PROXY: localhost,127.0.0.1,server,website,admin,waline,postgres,redis,kroki
      no_proxy: localhost,127.0.0.1,server,website,admin,waline,postgres,redis,kroki
      PORT: 8360
      WALINE_CONTROL_PORT: 8361
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: waline
      PG_USER: postgres
      PG_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_TOKEN: ""
    expose:
      - "8360"
      - "8361"
    volumes:
      - ./log:/var/log
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q -O - http://127.0.0.1:8361/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    restart: always
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: vanblog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vanblog"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - ./data/redis:/data
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --loglevel warning --requirepass \"$$REDIS_PASSWORD\"",
      ]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s

  kroki:
    logging: *default-logging
    image: yuzutech/kroki
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
